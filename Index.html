<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones Rojas - Interpol</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; background-color: #004080; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #003366; }
        
        /* Contenedor en cuadrícula para las tarjetas */
        #contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        /* Estilo de cada tarjeta */
        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #e0e0e0;
        }
        .card h4 {
            margin: 10px 0 5px 0;
            font-size: 16px;
            color: #333;
        }
        .card p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }
        #mensaje { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <h1>Notificaciones Rojas de Interpol</h1>
    <button id="btnConsultar">Cargar Perfiles</button>
    <div id="mensaje"></div>

    <!-- Contenedor donde se mostrarán las tarjetas -->
    <div id="contenedor"></div>

    <script src="app.js"></script>
</body>
</html>
